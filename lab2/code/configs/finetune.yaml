seed: 42
stage: finetune
use_wandb: false

data:
  patch_size: 9
  train_fraction: 0.8

 
  finetune_path:
    - ../image_data_float32/O013257.npz
    - ../image_data_float32/O013490.npz
    - ../image_data_float32/O012791.npz

  norm_load_path: checkpoints/pretrain/norm_stats.npz

  pretrained_checkpoint_dir: checkpoints/pretrain

dataloader_train:
  batch_size: 1024
  num_workers: 8
  shuffle: True

dataloader_val:
  batch_size: 1024
  num_workers: 8
  shuffle: False

optimizer:
  lr: 0.0001

autoencoder:
  n_input_channels: 8
  embedding_size: 8

checkpoint:
  save_top_k: 3
  monitor: 'val_loss'
  mode: 'min'
  filename: 'finetune-{epoch:03d}-{val_loss:.4f}'
  dirpath: 'checkpoints/finetune'

wandb:
  project: 'lab2-autoencoder'
  name: 'finetune'

trainer:
  max_epochs: 10
  log_every_n_steps: 200
